<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Analysis</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <h1>Voice Analysis</h1>
    <input type="file" id="audio-upload">
    <button onclick="uploadAudio()">Upload & Analyze</button>
    <p id="transcript"></p>
    <p id="feedback"></p>

    <script>
        async function uploadAudio() {
            const fileInput = document.getElementById("audio-upload").files[0];
            if (!fileInput) {
                alert("Please select an audio file.");
                return;
            }

            let formData = new FormData();
            formData.append("audio", fileInput);

            let response = await fetch("/api/voice/analyze", {
                method: "POST",
                body: formData
            });

            let data = await response.json();
            document.getElementById("transcript").innerText = "Transcript: " + data.transcript;
            document.getElementById("feedback").innerText = "Feedback: " + data.feedback;
        }
    </script>
</body>
</html>
